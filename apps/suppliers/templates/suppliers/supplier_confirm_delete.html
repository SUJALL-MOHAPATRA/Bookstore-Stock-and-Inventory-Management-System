{% extends 'base.html' %}
{% block title %}Delete Supplier — BISMMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Delete Supplier</h1>
    <a href="{% url 'suppliers:supplier_list' %}" class="btn secondary">Back</a>
</div>

<div class="confirm-delete">
    <p>Are you sure you want to delete <strong>{{ supplier.name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn danger">Yes, Delete</button>
        <a href="{% url 'suppliers:supplier_list' %}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
