{% extends 'base.html' %}
{% block title %}{{ action }} Supplier — BISMMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ action }} Supplier</h1>
    <a href="{% url 'suppliers:supplier_list' %}" class="btn secondary">Back</a>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <span class="field-error">{{ field.errors.0 }}</span>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">{{ action }} Supplier</button>
    </form>
</div>
{% endblock %}
