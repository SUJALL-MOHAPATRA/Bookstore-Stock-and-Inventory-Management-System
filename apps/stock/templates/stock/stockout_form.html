{% extends 'base.html' %}
{% block title %}Stock Out — BISMMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Record Stock-Out</h1>
    <a href="{% url 'stock:stock_history' %}" class="btn secondary">View History</a>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <span class="field-error">{{ field.errors.0 }}</span>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Record Stock-Out</button>
    </form>
</div>
{% endblock %}
